# Orchestrates the apprenticeships pipeline.
#
# Replaces Airflow for this project: Cloud Workflows is serverless, has a
# 5,000-step/month always-free allowance, and expresses the branch we actually
# need -- "only do work when the source published something new".
#
# The watcher always exits 0 and writes its decision to a GCS object. This is
# deliberate: Cloud Run marks any non-zero exit as failed, so signalling "no
# change" via an exit code would make a genuine crash indistinguishable from a
# routine skip. Reading an explicit decision keeps failures loud.

main:
  params: [input]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "europe-west2"
          - bucket: "dfe-appr-bronze-dfe-apprenticeships-2026"
          - started_at: ${time.format(sys.now())}

    # Any failure here propagates and fails the execution -- as it should.
    # v2 connector, not v1. The legacy Knative-style v1 `namespaces` API
    # resolves executions under a project-number namespace that the polling
    # call cannot read, producing a 403 even though the job itself succeeds.
    - check_for_new_version:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/dfe-appr-version-watcher"}
        result: watcher_result

    - read_decision:
        call: googleapis.storage.v1.objects.get
        args:
          bucket: ${bucket}
          object: "_state%2Flast_decision.json"
          alt: "media"
        result: decision

    - branch_on_decision:
        switch:
          - condition: ${decision.action == "extract"}
            next: extract
        next: no_change

    - extract:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/dfe-appr-extract"}
        result: extract_result

    # The bronze external table reads straight from GCS, so a new partition is
    # queryable with no reload step. Nothing to do here by design.
    - done:
        return:
          status: "extracted"
          version: ${decision.latest_version}
          started_at: ${started_at}
          finished_at: ${time.format(sys.now())}

    - no_change:
        return:
          status: "skipped_no_new_version"
          version: ${decision.latest_version}
          started_at: ${started_at}
          finished_at: ${time.format(sys.now())}
