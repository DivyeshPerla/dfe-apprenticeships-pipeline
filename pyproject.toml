[tool.ruff]
line-length = 88
# The container runs 3.12, but declaring 3.10 keeps the code portable and
# stops UP017 rewriting dt.timezone.utc to the 3.11+ dt.UTC alias -- which
# would break anyone running the ingestion locally on 3.10.
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# Beyond the defaults: pyupgrade, bugbear, comprehensions, timezone-safety,
# and refurb. DTZ matters here -- a naive local date would put a partition
# under the wrong ingest_date either side of midnight.
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "FURB", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]
